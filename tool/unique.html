<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAS Generator</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Danh sách không trùng</h1>
      <p>Dữ liệu không trùng nhau</p>
    </header>

    <section class="content">
      <div class="form-section">
        <div class="form-group">
          <label for="inputText">Text cần lọc:</label>
          <textarea id="inputText" placeholder="Nhập dữ liệu tại đây..." class="form-control"></textarea>
        </div>

        <div class="button-group">
          <button class="btn-submit" onclick="generateHAS()">Submit</button>
          <button class="btn-copy" onclick="copyResult()">Copy</button>
          <button class="btn-home" onclick="goHome()">Back to Home</button>
        </div>

        <!-- Output Area -->
        <div class="output" id="outputArea"></div>
      </div>
    </section>
  </div>

  <!-- Notification Box -->
  <div id="copyAlert" class="copy-notification" style="display: none;">
    Text copied to clipboard!
  </div>

  <script>
    function goHome() {
      window.location.href = "../index.html";
    }

    function generateHAS() {
      const input = document.getElementById("inputText").value;
      const lines = input
        .split('\n')
        .map(line => line.trim())
        .filter(line => line !== "");

      const unique = [...new Set(lines)];

      const result = unique.map((val, index) => {
        const base = `[HAS:A1/${val}] || [HAS:A2/${val}]`;
        return index === unique.length - 1 ? base : base + " ||";
      }).join('\n');

      document.getElementById("outputArea").textContent = result;
    }

    function copyResult() {
      const text = document.getElementById("outputArea").textContent;
      if (!text) {
        return;
      }

      navigator.clipboard.writeText(text).then(() => {
        const alertBox = document.getElementById("copyAlert");
        alertBox.style.display = "block";
        setTimeout(() => {
          alertBox.style.display = "none";
        }, 2000); // Display for 2 seconds
      });
    }
  </script>
</body>
</html>
