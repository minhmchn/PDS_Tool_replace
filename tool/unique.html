<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HAS Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    textarea {
      width: 100%;
      height: 150px;
    }
    .output {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #f4f4f4;
      padding: 10px;
      border: 1px solid #ccc;
    }
    button {
      margin-right: 10px;
    }
    #copyAlert {
  position: fixed;
  top: 20px;         /* Chuyển từ bottom lên top */
  right: 20px;       /* Chuyển từ left sang right */
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  border-radius: 6px;
  display: none;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  z-index: 1000;
}

  </style>
</head>
<body>

  <h2>Danh sách không trùng</h2>

  <textarea id="inputText" placeholder="Nhập dữ liệu tại đây..."></textarea>
  <br><br>
  <button onclick="generateHAS()">Tạo chuỗi </button>
  <button onclick="copyResult()">Copy kết quả</button>

  <div class="output" id="outputArea"></div>

  <div id="copyAlert">✅ Đã sao chép vào clipboard!</div>

  <script>
    function generateHAS() {
      const input = document.getElementById("inputText").value;
      const lines = input
        .split('\n')
        .map(line => line.trim())
        .filter(line => line !== "");

      const unique = [...new Set(lines)];

      const result = unique.map((val, index) => {
        const base = `[HAS:A1/${val}] || [HAS:A2/${val}]`;
        return index === unique.length - 1 ? base : base + " ||";
      }).join('\n');

      document.getElementById("outputArea").textContent = result;
    }

    function copyResult() {
      const text = document.getElementById("outputArea").textContent;
      if (!text) {
        return;
      }

      navigator.clipboard.writeText(text).then(() => {
        const alertBox = document.getElementById("copyAlert");
        alertBox.style.display = "block";
        setTimeout(() => {
          alertBox.style.display = "none";
        }, 2000); // Hiển thị trong 2 giây
      });
    }
  </script>

</body>
</html>
