<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
        overflow: hidden; /* Ẩn thanh cuộn */
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        max-width: 1000px;
        padding: 20px;
      }

      .link-button {
        display: inline-block;
        padding: 15px 30px;
        font-size: 20px;
        font-weight: bold;
        color: white;
        background-color: #3498db;
        border: none;
        border-radius: 10px;
        text-decoration: none;
        box-shadow: 5px 5px 0px #2c3e50;
        transition: all 0.3s ease;
        cursor: pointer;
        flex: 0 0 calc(30% - 20px);
        text-align: center;
      }

      .link-button:hover {
        background-color: #2980b9;
        transform: translateY(-2px);
        box-shadow: 5px 7px 0px #2c3e50;
      }

      .link-button:active {
        box-shadow: none;
        transform: translateY(4px);
      }

      h1 {
        margin-bottom: 30px;
        color: #333;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      }

      /* CSS cho hiệu ứng hoa mai rơi */
      @keyframes fall {
        to {
          transform: translateY(105vh);
        }
      }

      .hoa-mai {
        position: absolute;
        top: -50px;
        width: 25px;
        height: 25px;
        background-image: url('img/hoa-mai.png');
        background-size: contain;
        animation: fall linear infinite;
      }
    </style>
    <script>
      window.onload = function () {
        const container = document.querySelector('.container');
        const numberOfFlowers = 20;

        for (let i = 0; i < numberOfFlowers; i++) {
          const hoaMai = document.createElement('div');
          hoaMai.classList.add('hoa-mai');
          hoaMai.style.left = Math.random() * 100 + 'vw';
          hoaMai.style.animationDuration = Math.random() * 5 + 5 + 's'; // Thời gian rơi
          hoaMai.style.animationDelay = Math.random() * 2 + 's'; // Độ trễ
          container.appendChild(hoaMai);
        }
      };
    </script>
  </head>
  <body>
    <h1>PDS Tool</h1>
    <div class="container">
      <a href="tool/replace.html" class="link-button">TOOL_REPLACE</a>
      <a href="tool/loc.html" class="link-button">LOC</a>
      <a href="tool/test.html" class="link-button">SĐT</a>
      <a href="tool/ban.html" class="link-button">BAN</a>
      <a href="tool/unique.html" class="link-button">UNIQUE</a>
    </div>
  </body>
</html>
